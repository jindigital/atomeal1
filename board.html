<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토닥토닥 소통 게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #fdf6e3;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5eead4;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 sm:p-6 flex justify-center">
    
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col h-[90vh]">
        <!-- 상단 헤더 -->
        <header class="bg-teal-100 p-6 rounded-b-3xl shadow-sm z-10 relative flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-teal-800">💌 도란도란 게시판</h1>
                <p class="text-sm text-teal-600 mt-1">서로의 건강한 팁을 나누어요</p>
            </div>
            <!-- 식단 일기로 돌아가는 버튼 -->
            <a href="index.html" class="bg-white text-teal-700 px-3 py-1.5 rounded-full text-sm font-bold shadow hover:bg-teal-50 transition-all">
                식단 일기로
            </a>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
            
            <!-- 의견 입력 폼 -->
            <form id="board-form" class="flex flex-col gap-3 bg-teal-50 p-4 rounded-2xl border border-teal-100">
                <div class="flex gap-2">
                    <input type="text" id="nickname-input" placeholder="닉네임" required maxlength="10"
                        class="w-1/3 p-3 bg-white border border-teal-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-300 text-sm">
                    <input type="text" id="message-input" placeholder="따뜻한 이야기를 남겨주세요." required
                        class="w-2/3 p-3 bg-white border border-teal-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-300 text-sm">
                </div>
                <button type="submit" id="submit-btn" class="bg-teal-400 hover:bg-teal-500 text-white font-bold py-2 rounded-xl shadow-md transition-all mt-1">
                    등록하기
                </button>
            </form>

            <hr class="border-gray-100">

            <!-- 게시판 목록 리스트 -->
            <div class="flex flex-col gap-3">
                <h2 class="font-bold text-gray-700 flex items-center gap-2">
                    💬 모두의 이야기
                    <span id="loading-board" class="loader hidden"></span>
                </h2>
                <ul id="board-list" class="flex flex-col gap-3 pb-6">
                    <!-- 게시글이 여기에 추가됩니다 -->
                </ul>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ⚠️ 여기에 본인의 firebaseConfig를 꼭 붙여넣으세요! (index.html에 있는 것과 동일)
        const firebaseConfig = {
            apiKey: "AIzaSyBlb8UdAy4_uaxMk0XKbyKuC-N7ddRdOG8",
            authDomain: "atomeal1.firebaseapp.com",
            projectId: "atomeal1",
            storageBucket: "atomeal1.firebasestorage.app",
            messagingSenderId: "348105437958",
            appId: "1:348105437958:web:6b47abcf642a50c4416487",
            measurementId: "G-HNZYQHZT3L"
         };
      

        const appId = 'atopy-diet-app';
        let app, db, auth;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            signInAnonymously(auth); // 게시판도 익명 인증 사용
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        const boardList = document.getElementById('board-list');
        const loadingBoard = document.getElementById('loading-board');
        const form = document.getElementById('board-form');
        const nicknameInput = document.getElementById('nickname-input');
        const messageInput = document.getElementById('message-input');
        const submitBtn = document.getElementById('submit-btn');

        // 게시판 데이터 불러오기 (실시간)
        function loadBoard() {
            loadingBoard.classList.remove('hidden');
            // 모두가 함께 보는 공간이므로 users 안쪽이 아닌, 별도의 'public_board' 서랍장을 씁니다.
            const boardRef = collection(db, 'artifacts', appId, 'public_board');
            const q = query(boardRef);

            onSnapshot(q, (snapshot) => {
                loadingBoard.classList.add('hidden');
                
                if (snapshot.empty) {
                    boardList.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">아직 작성된 글이 없어요. 첫 인사를 남겨보세요!</p>';
                    return;
                }

                let records = [];
                snapshot.forEach(doc => {
                    records.push({ id: doc.id, ...doc.data() });
                });

                // 최신순 정렬
                records.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : Date.now();
                    const timeB = b.createdAt ? b.createdAt.toMillis() : Date.now();
                    return timeB - timeA;
                });

                boardList.innerHTML = '';
                records.forEach(record => {
                    const dateObj = record.createdAt ? record.createdAt.toDate() : new Date();
                    const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                    
                    const li = document.createElement('li');
                    li.className = 'bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-1';
                    
                    li.innerHTML = `
                        <div class="flex justify-between items-end">
                            <span class="font-bold text-teal-700 text-sm">${record.nickname}</span>
                            <span class="text-xs text-gray-400">${dateStr}</span>
                        </div>
                        <p class="text-sm text-gray-700 mt-1">${record.message}</p>
                    `;
                    boardList.appendChild(li);
                });
            });
        }

        loadBoard();

        // 게시글 등록하기
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nickname = nicknameInput.value.trim();
            const message = messageInput.value.trim();
            if (!nickname || !message) return;

            submitBtn.disabled = true;
            submitBtn.innerText = '등록 중...';

            try {
                const boardRef = collection(db, 'artifacts', appId, 'public_board');
                await addDoc(boardRef, {
                    nickname: nickname,
                    message: message,
                    createdAt: serverTimestamp()
                });
                messageInput.value = ''; // 내용만 비우고 닉네임은 유지
            } catch (error) {
                console.error("저장 실패:", error);
                alert("글을 등록하지 못했습니다.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '등록하기';
            }
        });
    </script>
</body>
</html>
