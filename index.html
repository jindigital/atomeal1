<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토닥토닥 식단일기 (AI 버전)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #fdf6e3;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5eead4;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* AI 동작 중 반짝임 효과 */
        .ai-glow { animation: glow 2s ease-in-out infinite alternate; }
        @keyframes glow {
            from { box-shadow: 0 0 5px #5eead4, 0 0 10px #5eead4; }
            to { box-shadow: 0 0 15px #2dd4bf, 0 0 20px #2dd4bf; }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 sm:p-6 flex justify-center">
    
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col h-[90vh]">

        <!-- 상단 헤더 -->
        <header class="bg-teal-100 p-6 rounded-b-3xl shadow-sm z-10 relative flex justify-between items-center">
            <div class="text-left">
                <h1 class="text-xl font-bold text-teal-800 flex items-center gap-1">
                    🌱 토닥토닥 식단일기 <span class="text-xs bg-teal-500 text-white px-2 py-0.5 rounded-full ml-1 ai-glow">AI</span>
                </h1>
                <p class="text-sm text-teal-600 mt-1">AI가 분석하는 나의 건강한 하루</p>
            </div>
            <!-- 게시판 이동 버튼 -->
            <a href="board.html" class="bg-white text-teal-700 px-3 py-1.5 rounded-full text-sm font-bold shadow hover:bg-teal-50 transition-all">
                소통 게시판
            </a>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
            
            <!-- 식단 입력 폼 -->
            <form id="diet-form" class="flex flex-col gap-3">
                <label for="food-input" class="font-semibold text-gray-700">오늘 어떤 음식을 드셨나요?</label>
                <textarea id="food-input" rows="3" placeholder="예: 점심으로 마라탕 먹고 후식으로 달콤한 아이스크림 먹었어 ㅠㅠ" 
                    class="w-full p-4 bg-orange-50 border border-orange-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-300 resize-none transition-all"></textarea>
                <button type="submit" id="submit-btn" class="bg-teal-400 hover:bg-teal-500 text-white font-bold py-3 rounded-2xl shadow-md transition-all flex justify-center items-center gap-2">
                    <span>AI 식단 분석하기</span>
                </button>
            </form>

            <!-- 피드백(출력창) 영역 -->
            <div id="feedback-box" class="hidden rounded-2xl p-5 shadow-sm transform transition-all duration-300 scale-95 opacity-0">
                <h3 id="feedback-title" class="font-bold text-lg mb-2"></h3>
                <p id="feedback-message" class="text-sm leading-relaxed"></p>
            </div>

            <hr class="border-gray-100">

            <!-- 이전 기록 리스트 -->
            <div class="flex flex-col gap-3">
                <h2 class="font-bold text-gray-700 flex items-center gap-2">
                    📖 나의 기록
                    <span id="loading-history" class="loader hidden"></span>
                </h2>
                <ul id="history-list" class="flex flex-col gap-3 pb-6">
                    <p class="text-sm text-gray-400 text-center py-4">아직 기록이 없어요. 첫 식단을 입력해보세요!</p>
                </ul>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 기존 파이어베이스 연결 설정 유지
        const firebaseConfig = {
            apiKey: "AIzaSyBlb8UdAy4_uaxMk0XKbyKuC-N7ddRdOG8",
            authDomain: "atomeal1.firebaseapp.com",
            projectId: "atomeal1",
            storageBucket: "atomeal1.firebasestorage.app",
            messagingSenderId: "348105437958",
            appId: "1:348105437958:web:6b47abcf642a50c4416487",
            measurementId: "G-HNZYQHZT3L"
        };

        const appId = 'atopy-diet-app';
        let app, db, auth, currentUserId;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        const historyList = document.getElementById('history-list');
        const loadingHistory = document.getElementById('loading-history');

        async function authenticateUser() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("인증 실패:", error);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                loadHistory(); 
            }
        });

        if(auth) authenticateUser();

        const form = document.getElementById('diet-form');
        const input = document.getElementById('food-input');
        const submitBtn = document.getElementById('submit-btn');
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackMessage = document.getElementById('feedback-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;
            
            if (!currentUserId) {
                showFeedback("연결 중...", "서버와 연결 중입니다. 잠시 후 다시 시도해주세요.", "warning");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span> AI가 생각하는 중...';
            feedbackBox.classList.add('hidden'); 

            try {
                // 1. Vercel 서버리스 함수로 텍스트 전송 (API 호출)
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error('API 서버 에러');

                const aiResult = await response.json();
                
                // 2. 파이어베이스에 저장
                const dietsRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'diets');
                await addDoc(dietsRef, {
                    text: text,
                    detected: aiResult.detected, 
                    createdAt: serverTimestamp()
                });
                
                // 3. 화면에 피드백 표시
                const isWarning = aiResult.detected.length > 0;
                showFeedback(aiResult.title, aiResult.message, isWarning ? 'warning' : 'success');
                input.value = ''; 

            } catch (error) {
                console.error("분석 실패:", error);
                showFeedback("오류 발생", "AI 분석을 완료하지 못했습니다. 새로고침 후 다시 시도해주세요.", "warning");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>AI 식단 분석하기</span>';
            }
        });

        function showFeedback(title, message, type) {
            feedbackTitle.innerText = title;
            feedbackMessage.innerText = message; 
            
            feedbackBox.classList.remove('hidden');
            void feedbackBox.offsetWidth; 
            
            if (type === 'warning') {
                feedbackBox.className = 'rounded-2xl p-5 shadow-sm transform transition-all duration-300 bg-rose-50 border border-rose-100 text-rose-800 scale-100 opacity-100 mb-4';
            } else {
                feedbackBox.className = 'rounded-2xl p-5 shadow-sm transform transition-all duration-300 bg-teal-50 border border-teal-100 text-teal-800 scale-100 opacity-100 mb-4';
            }
        }

        function loadHistory() {
            if (!currentUserId) return;
            loadingHistory.classList.remove('hidden');

            const dietsRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'diets');
            const q = query(dietsRef);

            onSnapshot(q, (snapshot) => {
                loadingHistory.classList.add('hidden');
                
                if (snapshot.empty) {
                    historyList.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">아직 기록이 없어요. 첫 식단을 입력해보세요!</p>';
                    return;
                }

                let records = [];
                snapshot.forEach(doc => {
                    records.push({ id: doc.id, ...doc.data() });
                });

                records.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : Date.now();
                    const timeB = b.createdAt ? b.createdAt.toMillis() : Date.now();
                    return timeB - timeA;
                });

                historyList.innerHTML = '';
                records.forEach(record => {
                    const dateObj = record.createdAt ? record.createdAt.toDate() : new Date();
                    const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                    
                    const li = document.createElement('li');
                    li.className = 'bg-gray-50 rounded-2xl p-4 shadow-sm border border-gray-100';
                    
                    let tagsHtml = '';
                    if (record.detected && record.detected.length > 0) {
                        tagsHtml = `<div class="mt-2 flex gap-1 flex-wrap">` + 
                            record.detected.map(cat => `<span class="bg-rose-100 text-rose-700 text-xs px-2 py-1 rounded-full">${cat}</span>`).join('') +
                        `</div>`;
                    } else {
                        tagsHtml = `<div class="mt-2"><span class="bg-teal-100 text-teal-700 text-xs px-2 py-1 rounded-full">건강식✨</span></div>`;
                    }

                    li.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-xs text-gray-400">${dateStr}</span>
                        </div>
                        <p class="text-sm text-gray-700">${record.text}</p>
                        ${tagsHtml}
                    `;
                    historyList.appendChild(li);
                });
            });
        }
    </script>
</body>
</html>
